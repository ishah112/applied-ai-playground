services:
  db:
    image: postgres:16
    container_name: applied-ai-playground-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-playground}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-playground}
      POSTGRES_DB: ${POSTGRES_DB:-playground}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-playground} -d ${POSTGRES_DB:-playground}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
